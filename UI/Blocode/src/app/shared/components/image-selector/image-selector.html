<div class="w-full glass-card p-5 px-5.5 pb-6 mt-6">
  <div class="flex flex-row justify-between items-center mb-5 border-0 border-b dark:border-white/15 border-black/10 pb-4">
    <h3 class="text-[16px] font-bold dark:text-white/95">انتخاب تصویر</h3>
    <i class="fa-solid fa-xmark fa-lg cursor-pointer" style="color: rgb(21, 93, 252);"></i>
  </div>
  <div class="grid grid-cols-2 gap-6">
    <div>
      <p class="text-xs font-medium text-gray-500 mb-2 text-right">بارگذاری تصویر</p>
      <div
        id="drop-zone"
        onclick="document.getElementById('file-input').click()"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave()"
        ondrop="onDrop(event)"
        class="border-2 border-dashed border-gray-300 dark:border-gray-500 rounded-[16px] p-8 text-center cursor-pointer dark:hover:bg-black hover:bg-gray-50 transition-colors"
      >
        <i class="fa-solid fa-cloud-arrow-down fa-3x mb-4" style="color: rgb(21, 93, 252);"></i>
        <p class="text-sm font-medium text-gray-700 mb-1">فایل را اینجا رها کنید</p>
        <p class="text-xs text-gray-400">یا برای انتخاب کلیک کنید</p>
        <p class="text-[10px] text-gray-400 mt-1">PNG، JPG، WEBP — حداکثر ۵ مگابایت</p>
        <input
          id="file-input"
          type="file"
          accept="image/*"
          multiple=""
          class="hidden"
          onchange="handleFiles(this.files)"
        />
      </div>
      <div class="mt-3 flex flex-col gap-2">
        <div class="relative">
          <i
            class="ti ti-file-description absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"
          ></i>
          <input
            id="file-name"
            type="text"
            placeholder="نام فایل"
            class="focus:border-black/30 dark:focus:border-white/30 w-full input-text-normal h-9 border border-black/20 dark:border-white/20 dark:text-white/95 rounded-[15px] py-1 px-2 outline-0"
          />
        </div>
        <div class="relative">
          <i class="ti ti-tag absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input
            id="file-title"
            type="text"
            placeholder="عنوان"
            class="focus:border-black/30 dark:focus:border-white/30 w-full input-text-normal h-9 border border-black/20 dark:border-white/20 dark:text-white/95 rounded-[15px] py-1 px-2 outline-0"
          />
        </div>
        <button
          onclick="uploadImage()"
          class="w-full cursor-pointer bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-sm font-medium py-2 rounded-[16px] shadow-md shadow-black/20 transition-all"
        >
          <i class="ti ti-upload text-sm align-[-2px] ml-1"></i>
          بارگذاری
        </button>
      </div>
    </div>
    <div class="h-full flex flex-col">
      <p class="text-xs font-medium text-gray-500 mb-2 text-right">تصاویر انتخاب‌شده</p>
      <div
        id="gallery"
        class="bg-gray-50 dark:bg-black border border-black/20 dark:border-white/20 rounded-[16px] p-2 min-h-[240px] h-full grid grid-cols-2 gap-2 content-start"
      >
        <div
          id="empty-state"
          class="col-span-2 flex flex-col items-center justify-center min-h-[200px] text-gray-400"
        >
          <i class="fa-regular fa-eye-slash fa-xl mb-4" style="color: rgb(129, 129, 129);"></i>
          <p class="text-xs">هنوز تصویری انتخاب نشده</p>
        </div>
      </div>
      <div class="mt-2 flex justify-between items-center">
        <span id="count-label" class="text-[11px] text-gray-400">۰ تصویر</span>
        <button
          onclick="clearAll()"
          class="text-[11px] text-red-500 hover:bg-red-50 px-2 py-1 rounded transition-colors"
        >
          <i class="ti ti-trash text-xs align-[-1px]"></i>
          حذف همه
        </button>
      </div>
    </div>
  </div>
</div>
